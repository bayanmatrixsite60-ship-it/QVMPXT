.sb{flex:1 1 auto;min-height:0;overflow:auto;padding:20px;overscroll-behavior:contain}
.sh.dr{position:absolute;right:0;top:0;bottom:0;left:auto;margin:0;background:#080d1c;-webkit-backdrop-filter:none;backdrop-filter:none;border-radius:24px 0 0 24px;animation:ms .24s ease}
.sh.dr .sb{padding-top:calc(16px + env(safe-area-inset-top));padding-bottom:calc(16px + env(safe-area-inset-bottom))}
@keyframes mf{from{opacity:0}}
@media(max-width:560px){.sh:not(.dr){align-self:flex-end;border-radius:24px 24px 0 0;border-bottom:0;animation:mb .24s ease}.sh:not(.dr) .sb{padding-bottom:calc(20px + env(safe-area-inset-bottom))}}
.dli:hover,.dli.on{background:#101a33}
.ac,.ft{background:#0b1224}
.ac b,.ac small{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.ac>span:last-child{min-width:0}
.orow{display:flex;gap:6px;align-items:center}.orow .ac{flex:1;min-width:0}
.u3>div{background:#0b1224;border:1px solid rgba(148,163,184,.18)}
.dsep{height:1px;background:rgba(148,163,184,.2);margin:10px 4px}
.dme{display:flex;align-items:center;gap:12px;padding:10px;border:1px solid rgba(0,240,255,.3);border-radius:14px;background:#0b1224;margin-bottom:12px}
.dme b{display:block;line-height:1.2}.dme small{color:var(--mu);word-break:break-all}
details>summary{list-style:none}details>summary::-webkit-details-marker{display:none}

/* --- additions: back button, network banner, help guide, feedback --- */
.back{margin:0 0 12px;border-color:rgba(0,240,255,.45);color:#00f0ff;font-weight:700;box-shadow:0 0 14px rgba(0,240,255,.16)}
#net{position:fixed;top:0;left:0;right:0;z-index:95;display:none;padding:calc(7px + env(safe-area-inset-top)) 12px 7px;text-align:center;font-size:13px;font-weight:600;background:rgba(245,158,11,.96);color:#1a1200}
#net.on{display:block}
main [hidden]{display:none!important}
.hp details{margin-bottom:8px}.hp summary{cursor:pointer}.hp ol{margin:10px 0 0;padding-inline-start:20px}.hp li{margin:6px 0;line-height:1.5;color:var(--mu)}
.fbm{width:100%;margin:10px 0;min-height:120px;resize:vertical;background:rgba(2,6,23,.6);border:1px solid var(--ln);border-radius:10px;padding:10px;color:inherit;font:inherit}
#fbt{width:100%}

/* v5: live voice, deep reports, enterprise drawer */
.md{background:#060a16;border:1px solid var(--ln);border-radius:12px;padding:14px 16px;margin-top:8px;font-size:15px;line-height:1.65;overflow-wrap:anywhere}
.md h2,.md h3,.md h4,.md h5{display:block;margin:1.2em 0 .4em;line-height:1.25}.md>:first-child{margin-top:0}
.md h2{font-size:21px;border-bottom:1px solid var(--ln);padding-bottom:6px}.md h3{font-size:17px;color:var(--cy)}.md h4,.md h5{font-size:15px}
.md p{margin:.6em 0}.md ul,.md ol{padding-inline-start:22px;margin:.5em 0}.md li{margin:.25em 0}.md hr{border:0;border-top:1px solid var(--ln)}
.md blockquote{margin:.6em 0;padding:2px 12px;border-inline-start:3px solid var(--in);color:var(--mu)}.md .tw{overflow-x:auto;margin:.6em 0}.md th{color:var(--cy)}.md a{color:var(--mi)}
.sh.dr{width:min(390px,92vw)}.dq{margin:0 0 8px}
.dg{border:1px solid var(--ln);border-radius:14px;background:#0b1224;margin:8px 0;overflow:hidden}
.dg>summary{display:flex;align-items:center;gap:10px;padding:8px 12px;cursor:pointer;min-height:50px;font-size:14px}
.dg>summary .chv{margin-inline-start:auto;color:var(--mu);transition:transform .2s;display:grid}.dg[open]>summary .chv{transform:rotate(90deg)}
.dg>summary:focus-visible{outline:2px solid var(--cy);outline-offset:-2px}.dg>.dl{padding:0 6px 8px}.dg .dli{font-size:14px}
@media(prefers-reduced-motion:reduce){.dg>summary .chv{transition:none}}
