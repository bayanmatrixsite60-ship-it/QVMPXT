<style>
:root{--bg:#03050C;--tx:#f1f5f9;--mu:#94a3b8;--ln:rgba(148,163,184,.2);--cy:#00f0ff;--in:#6366f1;--em:#10b981;--mi:#34d399;--am:#f59e0b;--cr:#ff3366;--bt:#f7931a}
*{box-sizing:border-box}html,body{margin:0}[hidden]{display:none!important}
body{background:var(--bg);color:var(--tx);font:16px/1.5 ui-sans-serif,system-ui,"Noto Sans Bengali","Noto Sans SC","Noto Sans JP","Noto Naskh Arabic",sans-serif;min-height:100vh;overflow-x:hidden}
body:before{content:"";position:fixed;inset:-20%;z-index:-2;background:radial-gradient(500px 400px at 15% 20%,rgba(99,102,241,.4),transparent),radial-gradient(500px 400px at 85% 30%,rgba(0,240,255,.22),transparent),radial-gradient(600px 400px at 50% 95%,rgba(16,185,129,.25),transparent),radial-gradient(380px 300px at 90% 85%,rgba(247,147,26,.14),transparent),radial-gradient(320px 260px at 8% 80%,rgba(255,51,102,.12),transparent)}
@media(max-width:700px){body:before{animation:none}}
@keyframes dr{to{transform:translate(4%,3%) scale(1.08)}}
#bg{position:fixed;inset:0;z-index:-1}
.w{max-width:1100px;margin:auto;padding:0 14px}
nav{position:sticky;top:0;z-index:20;background:rgba(3,5,12,.94);border-bottom:1px solid var(--ln);padding-top:env(safe-area-inset-top)}
.nb{display:flex;align-items:center;gap:8px;padding:4px 0}.nb>.lgo{cursor:pointer;flex:none;display:flex;align-items:center;padding:4px}
.lk{display:flex;gap:2px;overflow-x:auto;flex:1;scrollbar-width:none}
.nv{flex:1 0 56px;display:flex;flex-direction:column;align-items:center;gap:1px;background:none;border:0;border-radius:10px;padding:6px 4px;cursor:pointer;color:var(--mu);font-size:10px;line-height:1.2}
.nv svg{width:22px;height:22px}.nv:hover,.nv.on{color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent)}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
button,select,input,textarea{font:inherit;color:inherit}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--ln);background:rgba(148,163,184,.08);padding:8px 12px;border-radius:10px;cursor:pointer;min-height:40px;color:inherit;text-decoration:none;transition:transform .12s,background .2s}
.btn:hover{background:rgba(148,163,184,.18)}.btn:active{transform:scale(.97)}.btn:disabled{opacity:.5}
.btn:focus-visible,.nv:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--cy);outline-offset:2px}
.btn.on{border-color:var(--c,var(--cy));color:var(--c,var(--cy));background:color-mix(in srgb,var(--c,var(--cy)) 14%,transparent)}
.pri{background:linear-gradient(135deg,var(--in),var(--cy));color:#03050C;font-weight:800;border:0}.pri:hover{filter:brightness(1.1);background:linear-gradient(135deg,var(--in),var(--cy))}
select,input,textarea{background:rgba(148,163,184,.08);border:1px solid var(--ln);border-radius:10px;padding:9px 12px;width:100%}select{width:auto}
.card{background:rgba(15,23,42,.82);border:1px solid var(--ln);border-radius:18px;padding:16px;box-shadow:0 0 0 1px color-mix(in srgb,var(--c,#6366f1) 14%,transparent),0 6px 18px rgba(0,0,0,.28)}
.g{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}.r{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}.r>*{flex:1 1 130px}
.hero{padding:40px 0 18px}.hero h1{font-size:clamp(32px,6.5vw,58px);line-height:1.08;margin:0 0 12px;max-width:14em}.hero p{color:var(--mu);max-width:36em}
.mu{color:var(--mu);font-size:14px}.o{white-space:pre-wrap;background:rgba(0,0,0,.35);border-radius:10px;padding:10px;margin-top:8px;font-size:13px;word-break:break-word}
.c1{--c:var(--cy)}.c2{--c:var(--em)}.c3{--c:var(--am)}.c4{--c:var(--bt)}.c5{--c:var(--in)}.c6{--c:var(--cr)}
.ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 18%,transparent);color:var(--c);margin-bottom:8px}
.tg{display:inline-block;padding:1px 9px;border-radius:99px;font-size:12px;border:1px solid}.high{color:var(--cr)}.medium{color:var(--am)}.low{color:var(--mi)}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:6px;text-align:start;border-bottom:1px solid var(--ln)}.sc{overflow-x:auto}
.num{font-size:32px;font-weight:800}.pg{animation:fi .35s ease}@keyframes fi{from{opacity:0;transform:translateY(8px)}}
h2{margin:26px 0 10px;display:flex;align-items:center;gap:8px}
#toast{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:#1e293b;border:1px solid var(--ln);padding:10px 16px;border-radius:12px;z-index:90;display:none;max-width:90vw}
.mx{display:flex;flex-wrap:wrap;gap:4px;margin:8px 0}.mx i{width:22px;height:22px;border-radius:6px;display:block}
.nd{cursor:pointer}code{background:rgba(0,0,0,.35);padding:1px 6px;border-radius:6px;word-break:break-all}
.av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--in),var(--cy));color:#03050C;font-weight:700;flex:none}
footer{margin-top:46px;border-top:1px solid var(--ln);background:rgba(3,5,12,.94);content-visibility:auto;contain-intrinsic-size:auto 420px;padding:26px 0 calc(20px + env(safe-area-inset-bottom))}
.fg{display:grid;gap:22px;grid-template-columns:2fr 1fr 1fr 1.2fr}@media(max-width:760px){.fg{grid-template-columns:1fr 1fr}.fg>:first-child{grid-column:1/-1}}
footer a{display:block;color:var(--mu);padding:3px 0;cursor:pointer}footer a:hover{color:var(--tx)}
.lg0{border-top:1px solid var(--ln);margin-top:18px;padding-top:14px;text-align:center;font-size:14px;color:var(--mu)}.lg0 b{color:var(--tx);display:block}
.bd{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--ln);border-radius:8px;padding:4px 9px;margin:3px 4px 3px 0;font-size:13px}
/* logo */
.lgo{gap:3px}.lgo .lgi.b{height:14px}
.lgs{filter:drop-shadow(0 0 8px rgba(0,240,255,.55))}
#spl{position:fixed;inset:0;z-index:100;background:var(--bg);display:grid;place-items:center;transition:opacity .5s}
.lgi{display:block;width:auto;flex:none;user-select:none;-webkit-user-drag:none;image-rendering:auto}
